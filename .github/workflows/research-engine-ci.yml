name: Research Engine CI

on:
  push:
    branches: [feature/research-contracts-engine]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  research-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile core pipeline and tests
        run: python -m compileall -q core pipeline tests
      - name: Run research contract tests
        run: pytest -q tests/test_research_engine.py tests/test_flags.py
