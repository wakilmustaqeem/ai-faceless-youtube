name: Independent Production Engine

on:
  workflow_dispatch:
  push:
    branches: [main, copy/hidayattube-production-engine]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    env:
      TTS_VOICE: en-US-GuyNeural
      TTS_RATE: "-5%"
      TTS_PITCH: "+0Hz"
      TTS_VOLUME: "+0%"
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-cjk fonts-hosny-amiri
          fc-cache -f
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run production hardening tests
        run: PYTHONPATH=. pytest -q
      - name: Block legacy slide renderer
        run: |
          ! grep -n "scripts/prepare_content.py" .github/workflows/production-engine.yml
          test -f scripts/cinematic_short_production.py
          echo "Legacy 30-second slide renderer is BLOCKED for this production track."
      - name: Prepare cinematic production inputs
        run: |
          echo "CINEMATIC SHORT V1: full-body presenter + 72-inch three-sided LCD + Letust Gadget"
          echo "Runtime assets and natural voice are supplied by the dedicated cinematic production job."
          echo "No legacy output/video.mp4 is consumed."
      - name: Public YouTube publishing
        run: |
          echo "PUBLIC YOUTUBE PUBLISHING: OFF"
          echo "Human review remains required."
