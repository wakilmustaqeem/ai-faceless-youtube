name: Independent Production Engine

on:
  workflow_dispatch:
  push:
    branches: [main, copy/hidayattube-production-engine]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    env:
      TTS_VOICE: en-US-GuyNeural
      TTS_RATE: "-5%"
      TTS_PITCH: "+0Hz"
      TTS_VOLUME: "+0%"
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-cjk fonts-hosny-amiri
          fc-cache -f
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run production hardening tests
        run: PYTHONPATH=. pytest -q
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Generate English production review video
        run: PYTHONPATH=. python scripts/prepare_content.py
      - name: Validate English content package
        run: PYTHONPATH=. python scripts/validate_content.py
      - name: Run Argos translation dry run
        run: |
          PYTHONPATH=. python scripts/translate.py             --input tests/fixtures/translation_input.json             --output output/translations             --locales ur ar hi es fr             --auto-install
      - name: Verify localized outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for locale in ["ur","ar","hi","es","fr"]:
              p = Path("output/translations") / f"{locale}.json"
              data = json.loads(p.read_text(encoding="utf-8"))
              assert data["locale"] == locale
              assert data["brand_name"] == "AI & IT Future Tech"
              assert "AI & IT Future Tech" in data["script"]
          print("Argos phase-one translation dry run passed for 5 locales.")
          PY
      - name: Upload private review artifact
        uses: actions/upload-artifact@v4
        with:
          name: independent-production-review
          path: output/
      - name: Public YouTube publishing
        run: |
          echo "PUBLIC YOUTUBE PUBLISHING: OFF"
          echo "Human review remains required."
