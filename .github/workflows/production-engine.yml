name: Independent Production Engine

on:
  workflow_dispatch:
  push:
    branches: [main, copy/hidayattube-production-engine]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    env:
      TTS_VOICE: ur-PK-AsadNeural
      TTS_RATE: "-10%"
      TTS_PITCH: "+0Hz"
      TTS_VOLUME: "+0%"
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and Urdu fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-cjk fonts-hosny-amiri
          fc-cache -f
          test -f /usr/share/fonts/truetype/noto/NotoNastaliqUrdu-Regular.ttf
          test -f /usr/share/fonts/truetype/noto/NotoNastaliqUrdu-Bold.ttf
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Generate production review video
        run: PYTHONPATH=. python scripts/prepare_content.py
      - name: Validate content package
        run: PYTHONPATH=. python scripts/validate_content.py
      - name: Upload private review artifact
        uses: actions/upload-artifact@v4
        with:
          name: independent-production-review
          path: output/
      - name: Public YouTube publishing
        run: |
          echo "PUBLIC YOUTUBE PUBLISHING: OFF"
          echo "Human review remains required."
