name: Premium Tech Style v3 Private Review

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "engine/**"
      - "scripts/generate_voice_v3.py"
      - "scripts/generate_music_v3.py"
      - "scripts/render_premium_v3.py"
      - ".github/workflows/premium-v3-review.yml"

permissions:
  contents: read

jobs:
  render-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          fc-cache -f
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Render private Test Video #1 v3
        run: PYTHONPATH=. python scripts/render_premium_v3.py
      - name: Verify video and audio streams
        run: |
          test -s output/review/test1_v3.mp4
          ffprobe -v error -show_entries format=duration:stream=index,codec_name,codec_type,width,height,r_frame_rate -of default=noprint_wrappers=1 output/review/test1_v3.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,channels,sample_rate -of default=noprint_wrappers=1 output/review/test1_v3.mp4
      - name: Upload private review artifact
        uses: actions/upload-artifact@v4
        with:
          name: test1-v3-private-review
          path: output/review/test1_v3.mp4
      - name: Publish gate
        run: |
          echo "PUBLIC YOUTUBE PUBLISHING: OFF"
          echo "Voice and visuals require human review before publication."
