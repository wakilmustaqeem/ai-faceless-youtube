name: Premium Tech Style v3.5 Private Review

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "engine/**"
      - "scripts/**"
      - "config/**"
      - "docs/visual_purpose_map_v1.md"
      - ".github/workflows/premium-v3-review.yml"

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          fc-cache -f
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Verify functional demo
        run: python scripts/verify_demo_v3_5.py
      - name: Run V3.5 originality gate
        run: python engine/governance/originality_gate.py
      - name: Render V3.5 private Test Video #1
        run: PYTHONPATH=. python scripts/render_premium_v3.py
      - name: Verify video/audio
        run: |
          test -s output/review/test1_v3_5.mp4
          ffprobe -v error -show_entries format=duration:stream=index,codec_name,codec_type,width,height,r_frame_rate -of default=noprint_wrappers=1 output/review/test1_v3_5.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,channels,sample_rate -of default=noprint_wrappers=1 output/review/test1_v3_5.mp4
      - name: Upload private review artifact
        uses: actions/upload-artifact@v4
        with:
          name: test1-v3-5-private-review
          path: output/review/test1_v3_5.mp4
      - name: Publish gate
        run: |
          echo "PUBLIC YOUTUBE PUBLISHING: OFF"
          echo "Human visual/audio QA required."
          echo "AI disclosure must be reviewed in YouTube Studio when applicable."
