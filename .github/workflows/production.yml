name: Production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate-config.py
      - run: python -m py_compile agents/*.py governance/*.py
      - run: echo "Production stages scaffolded; provider execution requires explicit configuration."
